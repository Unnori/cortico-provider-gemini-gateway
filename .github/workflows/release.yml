name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Ensure npm supports Trusted Publishing (OIDC)
        run: |
          npm install -g npm@11
          npm --version

      - name: Verify version and CHANGELOG.md
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const refType = process.env.GITHUB_REF_TYPE || "";
            const refName = process.env.GITHUB_REF_NAME || "";
            const expectedTag = `v${pkg.version}`;
            if (refType === "tag" && refName !== expectedTag) {
              console.error(`Tag ${refName} does not match package.json version ${expectedTag}`);
              process.exit(1);
            }
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8").replace(/\r\n/g, "\n");
            const escaped = pkg.version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const re = new RegExp(`^##\\s+.*\\b${escaped}\\b`, "m");
            if (!re.test(changelog)) {
              console.error(`CHANGELOG.md is missing a "## ${pkg.version}" heading`);
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `PKG_NAME=${pkg.name}\nPKG_VERSION=${pkg.version}\nTAG_NAME=${expectedTag}\n`);
            console.log(`Verified ${pkg.name}@${pkg.version} (${expectedTag}) matches CHANGELOG.md`);
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, and test
        run: pnpm verify

      - name: Publish to npm via Trusted Publishing (OIDC)
        run: |
          EXISTING=$(npm view "${PKG_NAME}@${PKG_VERSION}" version --registry=https://registry.npmjs.org/ 2>/dev/null | tr -d '[:space:]' || true)
          if [ "${EXISTING}" = "${PKG_VERSION}" ]; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published on npm; skipping."
          else
            npm publish --provenance --access public --registry=https://registry.npmjs.org/
          fi

      - name: Pack tarball for GitHub Release
        run: |
          TARBALL=$(npm pack --silent | tail -n 1)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").replace(/\r\n/g, "\n").split("\n");
            const out = [];
            let capture = false;
            for (const line of lines) {
              if (/^##\s+/.test(line)) {
                if (capture) break;
                if (line.includes(pkg.version)) { capture = true; continue; }
              } else if (capture) {
                out.push(line);
              }
            }
            fs.writeFileSync("/tmp/release-notes.md", out.join("\n").trim() + "\n");
          '

      - name: Create GitHub Release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG_NAME} already exists; skipping."
          else
            gh release create "${TAG_NAME}" "${TARBALL}" \
              --title "${TAG_NAME}" \
              --notes-file /tmp/release-notes.md
          fi
